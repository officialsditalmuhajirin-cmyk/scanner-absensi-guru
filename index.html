
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner Absensi Al Muhajirin</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 26px;
      line-height: 1.4;
    }

    #reader {
      width: 500px;
      max-width: 95%;
      margin: 30px auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    #hasil {
      font-size: 20px;
      font-weight: bold;
      margin-top: 25px;
      white-space: pre-line;
      line-height: 1.6;
    }

    #tombolSuara {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #198754;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #statusSuara {
      font-size: 14px;
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>

<body>
  <h1>
    SCANNER ABSENSI<br>
    SDIT & YAYASAN AL MUHAJIRIN
  </h1>

  <button id="tombolSuara" onclick="aktifkanSuara()">
    AKTIFKAN SUARA
  </button>

  <div id="statusSuara">Suara notifikasi belum diaktifkan.</div>

  <div id="reader"></div>
  <div id="hasil">Menyiapkan kamera...</div>

  <script>
    const hasil = document.getElementById("hasil");
    const statusSuara = document.getElementById("statusSuara");
    const tombolSuara = document.getElementById("tombolSuara");

    let suaraAktif = false;

    // AKTIFKAN SUARA
    function aktifkanSuara() {
      if (!("speechSynthesis" in window)) {
        statusSuara.innerText =
          "Browser tidak mendukung fitur suara.";
        return;
      }

      suaraAktif = true;

      tombolSuara.innerText = "SUARA AKTIF";
      tombolSuara.style.background = "#6c757d";

      statusSuara.innerText =
        "Suara notifikasi sudah aktif.";

      bicara("Suara notifikasi absensi sudah aktif.");
    }

    // FUNGSI SUARA
    function bicara(pesan) {
      if (!suaraAktif || !("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const suara = new SpeechSynthesisUtterance(pesan);
      suara.lang = "id-ID";
      suara.rate = 0.95;
      suara.pitch = 1;
      suara.volume = 1;

      window.speechSynthesis.speak(suara);
    }

    // WEB APP SDIT
    const URL_SDIT =
      "https://script.google.com/macros/s/AKfycbxhjM6McPrVzY3Li_la59W9OrjykXIJUZVIR4-_mnRYXpTpowAhzP3NvYZZR3sI7zzx/exec";

    const TOKEN_SDIT =
      "SDIT_MUHAJIRIN_SCANNER_2026_9f7Kx2Pq";

    // WEB APP STAFF YAYASAN
    const URL_YAYASAN =
      "https://script.google.com/macros/s/AKfycbyyeLMr9KgQVWRUcIlvlsxelMN9P6rJfxnKupk6U-EqzlIHFCc8vHyhjwde-XU5QwXuOQ/exec";

    const TOKEN_YAYASAN =
      "STYMHJ_SCANNER_2026_a8Q7mP4x";

    let sedangMemproses = false;

    function berhasilScan(decodedText) {
      if (sedangMemproses) return;

      sedangMemproses = true;
      hasil.innerText = "QR TERBACA!\nMemproses absensi...";

      let staffId;

      try {
        const url = new URL(decodedText);
        staffId = url.searchParams.get("id");

        if (!staffId) {
          throw new Error("ID tidak ditemukan");
        }
      } catch (error) {
        tampilkanHasil(
          "QR Code tidak dikenali.",
          "QR Code tidak dikenali. Silakan periksa QR Anda."
        );
        return;
      }

      let urlAbsensi;
      let token;

      if (staffId.startsWith("SDMHJ")) {
        urlAbsensi = URL_SDIT;
        token = TOKEN_SDIT;
      } else if (staffId.startsWith("STYMHJ")) {
        urlAbsensi = URL_YAYASAN;
        token = TOKEN_YAYASAN;
      } else {
        tampilkanHasil(
          "ID tidak dikenali.\nPeriksa QR Code.",
          "ID tidak dikenali. Silakan periksa QR Anda."
        );
        return;
      }

      kirimAbsensi(staffId, urlAbsensi, token);
    }

    function tampilkanHasil(pesan, pesanSuara) {
      hasil.innerText = pesan;

      if (pesanSuara) {
        bicara(pesanSuara);
      }

      setTimeout(function() {
        sedangMemproses = false;
        hasil.innerText =
          "Kamera aktif.\n\n" +
          "Silakan arahkan QR Code ke kamera.";
      }, 5000);
    }

    function kirimAbsensi(staffId, urlAbsensi, token) {
      const namaCallback =
        "hasilAbsensi_" +
        Date.now() + "_" +
        Math.floor(Math.random() * 100000);

      let selesai = false;

      const script = document.createElement("script");

      const batasWaktu = setTimeout(function() {
        if (selesai) return;
        selesai = true;

        delete window[namaCallback];
        script.remove();

        tampilkanHasil(
          "Tidak ada respons dari sistem absensi.\n" +
          "Periksa koneksi dan URL Web App.",
          "Absensi gagal, belum tercatat. Silakan periksa koneksi internet."
        );
      }, 15000);

      window[namaCallback] = function(data) {
        if (selesai) return;
        selesai = true;

        clearTimeout(batasWaktu);
        delete window[namaCallback];
        script.remove();

        const unit = staffId.startsWith("SDMHJ")
          ? "SDIT"
          : "YAYASAN";

        hasil.innerText =
          unit + "\n" +
          (data.message || "Respons diterima.");

        if (data.success && data.nama) {
          hasil.innerText += "\nNama: " + data.nama;
        }

        if (data.success && data.keterangan) {
          hasil.innerText +=
            "\nKeterangan: " + data.keterangan;
        }

        if (data.success && data.waktu) {
          hasil.innerText += "\nWaktu: " + data.waktu;
        }

        // SUARA BERDASARKAN HASIL DARI SERVER
        if (data.success === true) {

          let jenisAbsensi = "";

          const keterangan =
            (data.keterangan || "").toUpperCase();

          if (
            keterangan.includes("KEDATANGAN") ||
            keterangan === "HADIR"
          ) {
            jenisAbsensi = "kedatangan";
          } else if (
            keterangan.includes("KEPULANGAN") ||
            keterangan === "PULANG"
          ) {
            jenisAbsensi = "kepulangan";
          }

          if (jenisAbsensi) {
            bicara(
              "Absensi " + jenisAbsensi +
              " berhasil dan sudah tercatat."
            );
          } else {
            bicara(
              "Absensi berhasil dan sudah tercatat."
            );
          }

        } else {

          const pesanServer =
            (data.message || "").toLowerCase();

          if (
            pesanServer.includes("sudah") &&
            (
              pesanServer.includes("absen") ||
              pesanServer.includes("scan") ||
              pesanServer.includes("tercatat")
            )
          ) {
            bicara(
              "Absensi sudah tercatat sebelumnya."
            );
          } else {
            bicara(
              "Absensi gagal, belum tercatat."
            );
          }
        }

        setTimeout(function() {
          sedangMemproses = false;
          hasil.innerText =
            "Kamera aktif.\n\n" +
            "Silakan arahkan QR Code ke kamera.";
        }, 5000);
      };

      script.onerror = function() {
        if (selesai) return;
        selesai = true;

        clearTimeout(batasWaktu);
        delete window[namaCallback];
        script.remove();

        tampilkanHasil(
          "Gagal menghubungi sistem absensi.",
          "Absensi gagal, belum tercatat. Gagal menghubungi sistem."
        );
      };

      script.src =
        urlAbsensi +
        "?action=scan" +
        "&id=" + encodeURIComponent(staffId) +
        "&token=" + encodeURIComponent(token) +
        "&callback=" + encodeURIComponent(namaCallback);

      document.body.appendChild(script);
    }

    function gagalScan(errorMessage) {
      // Kesalahan pembacaan sementara diabaikan.
    }

    const scanner = new Html5Qrcode("reader");

    Html5Qrcode.getCameras()
      .then(function(devices) {
        if (!devices || !devices.length) {
          hasil.innerText = "Kamera tidak ditemukan.";
          return;
        }

        let kameraId = devices[0].id;

        for (let i = 0; i < devices.length; i++) {
          if (
            devices[i].label &&
            devices[i].label.toLowerCase().includes("usb")
          ) {
            kameraId = devices[i].id;
            break;
          }
        }

        scanner.start(
          kameraId,
          { fps: 10, qrbox: 250 },
          berhasilScan,
          gagalScan
        )
        .then(function() {
          hasil.innerText =
            "Kamera aktif.\n\n" +
            "Silakan arahkan QR Code ke kamera.";
        })
        .catch(function(error) {
          hasil.innerText =
            "Kamera tidak dapat dibuka:\n" + error;
        });
      })
      .catch(function(error) {
        hasil.innerText =
          "Tidak dapat mengakses kamera:\n" + error;
      });
  </script>
</body>
</html>

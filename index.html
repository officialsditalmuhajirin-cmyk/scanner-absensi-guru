<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner Absensi Guru SDIT Al Muhajirin</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 26px;
      line-height: 1.4;
    }

    #reader {
      width: 500px;
      max-width: 95%;
      margin: 30px auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    #hasil {
      font-size: 20px;
      font-weight: bold;
      margin-top: 25px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>
    SCANNER ABSENSI GURU<br>
    SDIT AL MUHAJIRIN
  </h1>

  <div id="reader"></div>

  <div id="hasil">
    Menyiapkan kamera...
  </div>

  <script>

    const hasil = document.getElementById("hasil");

    function berhasilScan(decodedText) {

      hasil.innerText =
        "QR TERBACA!\n\n" + decodedText;

    }

    function gagalScan(errorMessage) {
      // Kesalahan pembacaan sementara diabaikan
    }


    const scanner = new Html5Qrcode("reader");


    Html5Qrcode.getCameras()
      .then(function(devices) {

        if (devices && devices.length) {

          // Cari kamera USB jika tersedia
          let kameraId = devices[0].id;

          for (let i = 0; i < devices.length; i++) {

            if (
              devices[i].label &&
              devices[i].label.toLowerCase().includes("usb")
            ) {
              kameraId = devices[i].id;
              break;
            }

          }


          scanner.start(
            kameraId,

            {
              fps: 10,
              qrbox: 250
            },

            berhasilScan,
            gagalScan

          ).then(function() {

            hasil.innerText =
              "Kamera aktif.\n\nSilakan arahkan QR Code ke kamera.";

          }).catch(function(error) {

            hasil.innerText =
              "Kamera tidak dapat dibuka:\n" + error;

          });

        } else {

          hasil.innerText =
            "Kamera tidak ditemukan.";

        }

      })
      .catch(function(error) {

        hasil.innerText =
          "Tidak dapat mengakses kamera:\n" + error;

      });

  </script>

</body>
</html>
